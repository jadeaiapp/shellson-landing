name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN'a Pages'e yayın izni ver
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; devam eden çalışmayı iptal etme
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Proje sayfası alt dizinde yayınlanıyor
          BASE_PATH: /shellson-landing/

      - name: Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: Çıktıyı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
