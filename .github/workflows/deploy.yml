name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages'e yayın için gereken izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; devam eden yayın iptal edilmez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü ve derleme
        run: npm run build

      - name: Demo modu güvenliğini doğrula
        # Konsept sürümünün yanlışlıkla indekslenebilir hale gelmesini engeller.
        run: |
          set -e
          grep -q "noindex" dist/index.html
          grep -q "nofollow" dist/index.html
          grep -q "noarchive" dist/index.html
          grep -q "Disallow: /" dist/robots.txt
          if grep -q "application/ld+json" dist/index.html; then
            echo "HATA: Demo sürümünde JSON-LD bulundu."
            exit 1
          fi
          echo "Demo modu güvenliği tamam."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Yayınla
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
